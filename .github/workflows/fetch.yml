name: download-candles
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch: {}
concurrency:
  group: memebot-data
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download candles for pools older than 24h (resumable)
        run: timeout 165m python history_fetch.py fetch --pools data/pools_seen.csv --out data/candles --days 2 --min-age-h 24 --min-liq-usd 5000 --preset public
        continue-on-error: true
      - name: Save to the repo
        if: always()
        run: |
          git config user.name "collector"
          git config user.email "collector@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "candles $(date -u +%FT%TZ)" && git pull --rebase && git push)
